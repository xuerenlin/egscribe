[workspace]
members = [
    ".",
    "plugins/plugin_sdk",
    "plugins/simple",
    "plugins/cal",
    "plugins/xlsx2md",
]
resolver = "2"

[package]
name = "egscribe"
version = "0.1.0"
default-run = "egscribe"
authors = ["Linxr <linxr.2005@163.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.76"
publish = false

[dependencies]

eframe = { version = "0.33.2",  features = [
    "default",
    "__screenshot", # __screenshot is so we can dump a screenshot using EFRAME_SCREENSHOT_TO
] }

egui_extras = { version = "0.33.2",  features = [ "default", "all_loaders"]}
log = { version = "0.4", features = ["std"] }
env_logger = "0.10"
dyn-clone = "1.0.17"
markdown = "1.0.0-alpha.21"
regex = "*"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.5"
image = "0.25.6"
uuid = { version = "1.7", features = ["v7"] }
rust-crypto = "0.2.36"
base64 = "0.21"
interprocess = "1.1"
encoding_rs = "0.8"
chardetng = "0.1"
rfd = "0.14"
chrono = "0.4"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "implement",
    "Win32_System_Com",
    "Win32_UI_Input_Ime",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Globalization",
] }

# 
# tree-sitter
