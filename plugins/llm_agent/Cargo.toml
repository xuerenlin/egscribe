[package]
name = "llm_agent"
version = "0.1.0"
edition = "2021"
authors = ["egscribe"]

[dependencies]
plugin_sdk = { path = "../plugin_sdk" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
rig-core = { version = "*", default-features = false, features = ["reqwest", "native-tls"] }
thiserror = "2"
chrono = "0.4"
